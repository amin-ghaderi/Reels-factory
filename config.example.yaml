paths:
  inbox: data/inbox
  transcripts: data/transcripts
  candidates: data/candidates
  edit_plans: data/edit_plans
  output: data/output
  approved: data/approved
  rejected: data/rejected
  refined_transcripts: data/refined_transcripts
  refine_requests: data/refine_requests
  normalized_transcripts: data/normalized_transcripts
  semantic_plans: data/semantic_plans
  program_maps: data/program_maps
  qa_plans: data/qa_plans
  metadata: data/metadata
  portraits: data/portraits
  framing_profiles: data/framing_profiles
  final: data/final

transcription:
  model: small
  device: cpu
  compute_type: int8
  language: null        # null = auto-detect; use "fa", "en", "sv", etc. to force
  vad_filter: true
  beam_size: 5

refine:
  model: large-v3-turbo
  fallback_model: medium
  device: cpu
  compute_type: int8
  language: fa
  vad_filter: true
  beam_size: 5

candidate_mining:
  min_seconds: 20
  target_seconds: 38
  max_seconds: 62
  max_candidates: 24
  max_overlap_ratio: 0.45

render:
  width: 1080
  height: 1920
  fps: 30
  video_crf: 20
  audio_bitrate: 160k
  loudness_target_lufs: -16
  burn_captions: false
  subtitle_font: Tahoma
  subtitle_font_size: 18
  subtitle_margin_v: 110
  subtitle_outline: 2
  layout: stacked_faces
  lock_face_crops: true
  face_crop:
    zoom: 1.32
    headroom: 0.38
    horizontal_margin: 0.15
    body: 1.05

ai_editor:
  enabled: true
  normalization:
    model: composer-2.5
    mode: ask
  semantic_editor:
    model: grok-4.6
    reasoning: high
    full_transcript: true
  program_mapper:
    model: grok-4.6
    reasoning: high
    full_transcript: true
  qa_reel_editor:
    model: grok-4.6
    reasoning: high
  max_reels: null

packaging:
  enabled: true
  burn_subtitles: false
  write_srt: false
  instagram_captions: true
  cover_hold_s: 1.75
  transition_s: 0.25
  whoosh: assets/sounds/whoosh_soft.wav
